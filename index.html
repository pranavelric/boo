<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Boo, with love</title>
    <meta name="description" content="A personal little love letter for Boo, built with warm memories, gentle words, and a lot of affection.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://ask-her-out.rohansrma.me/">
    <link rel="icon" href="assets/img/logo.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/img/logo.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="preload" as="fetch" crossorigin href="assets/audio/song.mp3" type="audio/mpeg">
    <script>window.MUSIC_BASE = '';</script>
    <script src="assets/js/music.js"></script>
    <link rel="stylesheet" href="assets/css/common.css" />
    <link rel="stylesheet" href="assets/css/home.css" />
</head>

<body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <div class="ambient ambient-three"></div>

    <main class="landing" aria-label="love letter entrance">
        <p class="eyebrow">for my favorite person</p>
        <h1>Hey, boo.</h1>
        <p class="lead">I made something for you.</p>
        <p class="sublead">Because apparently, saying it out loud never felt like enough.</p>

        <div class="intro-gif-wrap">
            <img id="image" src="assets/img/love.gif" alt="Cute animated greeting" loading="eager">
        </div>

        <button type="button" class="hello-button" id="helloButton" aria-label="Open the love letter"
            onmouseover="ChangeImage('hi'); bg();" onmouseout="ResetImage(); resetBG();">
            Hello
        </button>

        <button type="button" class="open-letter" id="openLetter" aria-label="Open the love letter">
            Open the letter
        </button>

        <p class="tiny-note">One year of friendship, and somehow it already feels like home.</p>
    </main>

    <div class="watermark">Made with love for Aparna</div>

    <script src="assets/js/home.js"></script>
</body>
</html>
